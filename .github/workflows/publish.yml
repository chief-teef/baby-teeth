name: Publish blog
on:
  push:
    branches: [main]
    paths: ['config/**', 'content/**', 'media/**', 'blog/**', 'shared/**', 'public/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-blog
  cancel-in-progress: true
jobs:
  build:
    if: vars.BLOG_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run build:blog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-blog
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
